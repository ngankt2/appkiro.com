name: Publish Kiro Password Manager 1.0.17

on:
  push:
    branches: [release/password-manager-1.0.17]
    paths:
      - release-assets/**
      - .github/workflows/publish-password-manager-release.yml

permissions:
  contents: write

concurrency:
  group: publish-password-manager-1.0.17
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ngankt2/appkiro.com'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify package checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS
      - name: Validate the prepared update
        run: |
          python3 -m unittest discover -s tests -p '*_test.py'
          python3 scripts/validate-updates.py
          python3 scripts/publish-release.py appkiro-password-manager "$GITHUB_WORKSPACE/release-assets"
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create appkiro-password-manager-v1.0.17 \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "Kiro Password Manager 1.0.17" \
            --notes-file release-assets/RELEASE-NOTES.md \
            --draft \
            --latest=false \
            release-assets/KiroPasswordManager_1.0.17_arm64.app.tar.gz \
            release-assets/KiroPasswordManager_1.0.17_arm64.app.tar.gz.sig \
            release-assets/latest.json \
            release-assets/SHA256SUMS \
            release-assets/README.txt \
            release-assets/BUILD-INFO.json
          gh release edit appkiro-password-manager-v1.0.17 \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease \
            --latest=false
