name: Update Kiro Password Manager release documentation

on:
  push:
    branches: [release/password-manager-1.0.17]
    paths:
      - release-assets/**
      - scripts/update-release-docs.py
      - .github/workflows/publish-password-manager-release.yml

permissions:
  contents: write

concurrency:
  group: publish-password-manager-1.0.17
  cancel-in-progress: false

jobs:
  update-documentation:
    if: github.repository == 'ngankt2/appkiro.com'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify package and documentation checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS
      - name: Validate the prepared update
        run: |
          python3 -m unittest discover -s tests -p '*_test.py'
          python3 scripts/publish-release.py appkiro-password-manager "$GITHUB_WORKSPACE/release-assets"
      - name: Update and verify release documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update-release-docs.py
